<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Contact Us | Matrimony</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i
          class="fa-solid fa-heart-circle-check text-danger me-2"></i>Matrimony</a>
      <ul class="navbar-nav ms-auto flex-row gap-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="search.html">Search</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section class="py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card p-4 border-0 shadow-sm rounded-4">
            <h3 class="fw-bold mb-3">Send Us a Message</h3>
            <p class="text-muted">Have queries regarding verification or memberships? Reach out to us.</p>
            <form id="contactForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" id="cName" class="form-control" placeholder="Your Name" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email Address</label>
                  <input type="email" id="cEmail" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Subject</label>
                  <input type="text" class="form-control" placeholder="Inquiry subject" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Your Message</label>
                  <textarea id="cMessage" class="form-control" rows="4" placeholder="How can we assist you?"
                    required></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-danger btn-lg px-4">Submit Query</button>
                </div>
              </div>
              <div id="formAlert" class="d-none"></div>
            </form>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="card p-4 border-0 shadow-sm rounded-4 h-100">
            <h4 class="fw-bold mb-4">Support & Office</h4>
            <p><i class="fa-solid fa-phone text-danger me-2"></i> +91 98765 43210</p>
            <p><i class="fa-solid fa-envelope text-danger me-2"></i> support@matrimony.com</p>
            <p><i class="fa-solid fa-location-dot text-danger me-2"></i> Hazratganj, Lucknow, Uttar Pradesh, India</p>
            <hr>
            <h6>Operating Hours</h6>
            <p class="text-muted mb-0">Monday – Saturday: 9:30 AM – 6:30 PM (IST)</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
</body>

</html>
