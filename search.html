<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Search Verified Profiles | Matrimony</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i
                    class="fa-solid fa-heart-circle-check text-danger me-2"></i>Matrimony</a>
            <div class="collapse navbar-collapse show" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row">
                <!-- Sidebar Filters -->
                <div class="col-lg-3 mb-4">
                    <div class="card border-0 shadow-sm p-4 rounded-4">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-sliders text-danger me-2"></i>Filters</h5>
                        <form id="filterForm">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Gender</label>
                                <select id="filterGender" class="form-select">
                                    <option value="">Any Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Religion</label>
                                <select id="filterReligion" class="form-select">
                                    <option value="">Any Religion</option>
                                    <option value="Muslim">Muslim</option>
                                    <option value="Hindu">Hindu</option>
                                    <option value="Sikh">Sikh</option>
                                    <option value="Christian">Christian</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Max Age</label>
                                <input type="number" id="filterMaxAge" class="form-control" placeholder="e.g. 30">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">City</label>
                                <input type="text" id="filterCity" class="form-control" placeholder="e.g. Mumbai">
                            </div>
                            <div class="d-grid gap-2">
                                <button type="button" id="filterBtn" class="btn btn-danger">Apply Filters</button>
                                <button type="button" id="resetBtn" class="btn btn-outline-secondary">Reset</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Result Grid -->
                <div class="col-lg-9">
                    <div
                        class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm">
                        <h5 class="mb-0 fw-bold">Active Profiles</h5>
                        <span id="resultCount" class="badge bg-danger fs-6">Loading...</span>
                    </div>
                    <div class="row g-4" id="profilesContainer"></div>
                </div>
            </div>
        </div>
    </section>

    <button id="topBtn"><i class="fa-solid fa-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
</body>

</html>
